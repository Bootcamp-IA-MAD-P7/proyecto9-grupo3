schema: spec-driven

context: |
  Project: an evidence-backed NLP tool that helps YouTube moderators prioritize
  English comments for human review.
  Team: Gabriela, Miguel, and Fernanda have equal development standing.
  Jira project: SP. Every material change must trace to SP-<number>.
  Delivery target: AWS, deployed early through infrastructure coordinated with
  Miguel. Deployment details are not yet fixed.
  Product boundary: sentiment and harmful-content risk are separate signals.
  When evidence or conversational context is insufficient, abstain and recommend
  human review. Never perform YouTube moderation automatically.
  Standards: read docs/base-standards.md before creating or applying artifacts.
  Code and identifiers use English. Product discussion may use Spanish.

rules:
  proposal:
    - Include the Jira key and expected user or team outcome.
    - Separate validated facts, assumptions, open questions, and non-goals.
    - Do not expand MVP scope without explicit team agreement.
  specs:
    - Express observable requirements and WHEN/THEN scenarios.
    - Include uncertainty, error, empty, and human-review behavior when relevant.
    - Distinguish sentiment from harmful-content or policy decisions.
  design:
    - Record alternatives and why the chosen approach fits a seven-day project.
    - Cover data quality, privacy, observability, rollback, and external actions
      when relevant.
  tasks:
    - Keep tasks independently verifiable and small enough for focused review.
    - Include tests, documentation, and evidence steps appropriate to the risk.
    - Never mark a task complete before its evidence exists.

operations:
  apply:
    guidance:
      - Implement the smallest accepted slice and stop on spec drift.
      - Do not perform external writes, deployments, merges, or moderation actions
        without explicit authorization at the time of action.
  archive:
    guidance:
      - Require scenario evidence and independent teammate review.
      - Record unresolved gaps instead of presenting them as complete.
