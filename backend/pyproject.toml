[project]
name = "moderation-api"
version = "0.1.0"
description = "FastAPI service for human-assisted comment moderation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2,<3",
    "pwdlib[argon2]>=0.3,<1",
    "joblib>=1.3,<2",
    "scikit-learn>=1.7,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
