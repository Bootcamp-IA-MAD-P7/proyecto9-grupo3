[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moderation-backend"
version = "0.1.0"
description = "Internal API for human-assisted comment moderation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2,<3",
    "pwdlib[argon2]>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
model = [
    "pandas>=3,<4",
    "numpy>=2,<3",
    "scikit-learn>=1.7,<2",
    "joblib>=1.3,<2",
]
transformer = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "accelerate==1.15.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["backend"]
